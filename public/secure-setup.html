<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17201d">
  <title>邻聊 · 启用语音</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;color:#202823;background:#edf1ed;font-family:"Avenir Next",Avenir,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(610px,100%);padding:38px;border-radius:24px 7px 24px 24px;background:#fbfcfa;box-shadow:0 24px 70px rgba(35,54,45,.14)}.mark{width:48px;height:48px;display:grid;place-items:center;margin-bottom:25px;border-radius:14px 4px 14px 14px;color:white;background:#2f6e59;font-weight:700}h1{margin:0 0 11px;font-size:32px;letter-spacing:-.04em}p{margin:0 0 20px;color:#68766d;font-size:13px;line-height:1.75}.steps{margin:25px 0;padding:0;list-style:none;display:grid;gap:9px;counter-reset:step}.steps li{display:grid;grid-template-columns:28px 1fr;align-items:start;gap:9px;color:#445149;font-size:12px;line-height:1.65;counter-increment:step}.steps li:before{content:counter(step);width:25px;height:25px;display:grid;place-items:center;border-radius:8px 2px 8px 8px;color:#2f6e59;background:#deeee7;font:600 11px ui-monospace,monospace}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border:1px solid #ccd7d0;border-radius:10px 3px 10px 10px;color:#405047;background:white;text-decoration:none;font-size:12px;font-weight:600}.button.primary{border-color:#2f6e59;color:white;background:#2f6e59}.note{margin-top:18px;padding-top:15px;border-top:1px solid #e3e8e4;color:#89948d;font-size:10px}@media(max-width:560px){.card{padding:27px 22px}h1{font-size:26px}.actions{display:grid}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">邻</div>
    <h1>可选：启用网页长按录音</h1>
    <p>文字、文件和录音文件发送可以直接使用 HTTP，无需安装证书。只有网页直接访问麦克风才需要安全连接；HTTPS 仍使用同一个 3080 端口。</p>
    <ol class="steps">
      <li>下载局域网 CA 证书。</li>
      <li>在系统证书管理中安装，并将它设为始终信任；Firefox 如未使用系统证书库，请导入到“证书颁发机构”。</li>
      <li>重新打开安全聊天地址，允许麦克风权限即可录音。</li>
    </ol>
    <div class="actions">
      <a class="button" href="/lan-chat-ca.crt" download>1. 下载局域网证书</a>
      <a id="open-secure" class="button primary" href="#">2. 打开 3080 安全聊天</a>
    </div>
    <p class="note">证书只用于让浏览器确认这是受信任的局域网页面；聊天记录仍按原要求明文保存在服务器磁盘。</p>
  </main>
  <script>document.getElementById('open-secure').href='https://'+location.host+'/';</script>
</body>
</html>
